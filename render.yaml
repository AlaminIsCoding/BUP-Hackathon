services:
  - type: web
    name: gridwise-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: LLM_MODEL
        value: deepseek/deepseek-v4.1-flash
      - key: OPENROUTER_API_KEY
        sync: false
